spring.application.name=TodaysDessert

# ==========================================
# 1. H2 Database 설정 (파일 저장 모드로 어느 PC에서나 즉시 실행 및 영속 보장)
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/todaysdessert;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 웹 콘솔 활성화 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# 2. JPA / Hibernate 설정
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# (선택) 로컬 MySQL 연동 시 아래 주석 해제 후 사용
